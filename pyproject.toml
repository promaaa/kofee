[project]
name = "kofee"
version = "0.1.0"
description = "Embodiment-agnostic whiteboard-cleaning tasks with automatic visual verification."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10.0",
]

[project.scripts]
kofee = "kofee.app:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
