[project]
name = "kofee"
version = "0.1.0"
description = "Embodiment-agnostic whiteboard-cleaning tasks with automatic visual verification."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.2",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "uvicorn>=0.30",
]

[project.scripts]
kofee = "kofee.app:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
