[project]
name = "nunchi"
version = "0.1.0"
description = "Algorithm server for nunchi: finds the board and the ink to erase in a camera frame."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.2",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "uvicorn>=0.30",
]

[project.scripts]
nunchi = "nunchi.server:main"
nunchi-grid = "nunchi.grid:main"
nunchi-standalone = "nunchi.standalone.app:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
