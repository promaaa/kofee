<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 330" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#57606a"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1a7f37"/>
    </marker>
  </defs>
  <rect width="970" height="330" rx="14" fill="#ffffff"/>

  <g fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5">
    <rect x="30" y="40" width="170" height="96" rx="10"/>
    <rect x="270" y="40" width="200" height="96" rx="10"/>
    <rect x="540" y="40" width="170" height="96" rx="10"/>
    <rect x="800" y="40" width="140" height="96" rx="10"/>
  </g>
  <rect x="540" y="214" width="170" height="70" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>

  <g fill="#1f2328" font-size="17" font-weight="700" text-anchor="middle">
    <text x="115" y="80">Camera</text>
    <text x="370" y="80">Vision</text>
    <text x="625" y="80">Planner</text>
    <text x="870" y="80">Embodiment</text>
    <text x="625" y="244" fill="#1a7f37">Episode log</text>
  </g>
  <g fill="#57606a" font-size="13" text-anchor="middle">
    <text x="115" y="104">facing the board</text>
    <text x="115" y="122">about 1 frame/s</text>
    <text x="370" y="104">board, ink, dirty cells</text>
    <text x="370" y="122">~30 ms on a laptop CPU</text>
    <text x="625" y="104">one task per cell,</text>
    <text x="625" y="122">in board coordinates</text>
    <text x="870" y="104">person or robot</text>
    <text x="870" y="122">eraser, tissue, arm…</text>
    <text x="625" y="266" fill="#1a7f37">episodes.jsonl</text>
  </g>

  <g stroke="#57606a" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <line x1="200" y1="88" x2="266" y2="88"/>
    <line x1="470" y1="88" x2="536" y2="88"/>
    <line x1="710" y1="88" x2="796" y2="88"/>
    <path d="M870 136 V176 H115 V140"/>
  </g>
  <line x1="625" y1="136" x2="625" y2="210" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#g)"/>

  <g fill="#57606a" font-size="13" text-anchor="middle">
    <text x="235" y="78">frame</text>
    <text x="505" y="78">cells</text>
    <text x="755" y="78">"erase C2"</text>
    <text x="330" y="196">the attempt changes the board, and the camera sees the result</text>
  </g>
  <g fill="#1a7f37" font-size="13" text-anchor="start">
    <text x="634" y="200">first clear frame decides:</text>
  </g>
  <text x="625" y="310" fill="#1a7f37" font-size="13" text-anchor="middle">pass · retry with the next embodiment · give up after 3</text>
</svg>
